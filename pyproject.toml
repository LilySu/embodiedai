[project]
name = "embodied-agent-service"
version = "0.1.0"
description = "Embodied Coffee privacy-preserving OpenAI Agents SDK service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai-agents>=0.2.0",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "pydantic>=2.8.0",
    "pyjwt[crypto]>=2.9.0",
    "uvicorn>=0.30.0",
    "weave>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
embodied-agent-service = "embodied_agents.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/agent-service/src/embodied_agents"]

[tool.pytest.ini_options]
pythonpath = ["services/agent-service/src"]
testpaths = ["services/agent-service/tests"]
asyncio_mode = "auto"
